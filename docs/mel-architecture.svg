<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 832" width="940" height="832" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#FFFFFF" fill-opacity="0.55"/>
    </marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#4ADEE6" fill-opacity="0.85"/>
    </marker>
  </defs>

  <style>
    .n    { fill: #FFFFFF; fill-opacity: 0.06; stroke: #FFFFFF; stroke-opacity: 0.28; stroke-width: 1.1; }
    .t    { fill: #FFFFFF; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .s    { fill: #D3CCEF; font-size: 11.3px; text-anchor: middle; }
    .lbl  { fill: #D3CCEF; font-size: 11.3px; }
    .flow { fill: none; stroke: #FFFFFF; stroke-opacity: 0.42; stroke-width: 1.4; }
  </style>

  <!-- ══ AGENT LAYER band ══ -->
  <rect x="30" y="144" width="880" height="396" rx="10"
        fill="#9B7BFF" fill-opacity="0.085" stroke="#A98BFF" stroke-opacity="0.75"
        stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="50" y="168" fill="#C6B1FF" font-size="12px" font-weight="700" letter-spacing="0.5">AGENT LAYER — the model chooses and composes here</text>
  <text x="50" y="185" fill="#C6B1FF" fill-opacity="0.75" font-size="11px" letter-spacing="0.3">everything else is deterministic</text>

  <!-- ══ Question ══ -->
  <rect class="n" x="330" y="6" width="280" height="48" rx="7"/>
  <text class="t" x="470" y="36">Question + session identity</text>

  <path class="flow" d="M470,54 L470,62" marker-end="url(#ar)"/>

  <!-- ══ Deterministic router ══ -->
  <rect class="n" x="320" y="68" width="300" height="58" rx="7"/>
  <text class="t" x="470" y="92">Deterministic router</text>
  <text class="s" x="470" y="111">~10 patterns · 10ms · no model call</text>

  <path class="flow" d="M470,126 L470,172" marker-end="url(#ar)"/>
  <text class="lbl" x="482" y="141">no pattern match</text>

  <!-- ══ LLM router ══ -->
  <rect class="n" x="335" y="178" width="270" height="58" rx="7"/>
  <text class="t" x="470" y="202">LLM router</text>
  <text class="s" x="470" y="221">picks a tool · ~2s · minimal effort</text>

  <!-- ══ Chain budget ══ -->
  <rect x="620" y="158" width="280" height="80" rx="8"
        fill="#4ADEE6" fill-opacity="0.08" stroke="#4ADEE6" stroke-opacity="0.55"
        stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="760" y="182" fill="#FFFFFF" font-size="13px" font-weight="700" text-anchor="middle">chain budget — first limit wins</text>
  <text x="760" y="202" fill="#83EBF1" font-size="13.5px" font-weight="700" text-anchor="middle">3 steps · 100 records · 8s</text>
  <text x="760" y="222" fill="#D3CCEF" font-size="10.6px" text-anchor="middle">declared per plan class · checked every step</text>
  <path d="M760,158 L760,97 L626,97" fill="none" stroke="#4ADEE6" stroke-opacity="0.6"
        stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arc)"/>

  <!-- ══ Branch bus ══ -->
  <path class="flow" d="M470,236 L470,250 M160,250 L780,250"/>
  <path class="flow" d="M160,250 L160,256" marker-end="url(#ar)"/>
  <path class="flow" d="M470,250 L470,256" marker-end="url(#ar)"/>
  <path class="flow" d="M780,250 L780,256" marker-end="url(#ar)"/>

  <!-- ══ Row 1 ══ -->
  <rect class="n" x="50" y="262" width="220" height="72" rx="7"/>
  <text class="t" x="160" y="286">Plan tools</text>
  <text class="s" x="160" y="305">find_people, search_people</text>
  <text class="s" x="160" y="321">model composes a query</text>

  <rect class="n" x="360" y="262" width="220" height="72" rx="7"/>
  <text class="t" x="470" y="286">Named operations</text>
  <text class="s" x="470" y="305">find_mentor, org_chain,</text>
  <text class="s" x="470" y="321">skill_gap, skill_scarcity</text>

  <rect class="n" x="670" y="262" width="220" height="72" rx="7"/>
  <text class="t" x="780" y="286">semantic_help</text>
  <text class="s" x="780" y="305">a problem description,</text>
  <text class="s" x="780" y="321">not a filter</text>

  <path class="flow" d="M160,334 L160,342" marker-end="url(#ar)"/>
  <path class="flow" d="M470,334 L470,342" marker-end="url(#ar)"/>
  <path class="flow" d="M780,334 L780,342" marker-end="url(#ar)"/>

  <!-- ══ Row 2 ══ -->
  <rect class="n" x="50" y="348" width="220" height="72" rx="7"/>
  <text class="t" x="160" y="372">Validate + snap</text>
  <text class="s" x="160" y="391">registry-checked,</text>
  <text class="s" x="160" y="407">values fixed</text>

  <rect class="n" x="360" y="348" width="220" height="72" rx="7"/>
  <text class="t" x="470" y="372">Deterministic services</text>
  <text class="s" x="470" y="391">fixed method, open inputs</text>
  <text class="s" x="470" y="407">own role checks</text>

  <rect class="n" x="670" y="348" width="220" height="72" rx="7"/>
  <text class="t" x="780" y="372">Local vectors + RRF</text>
  <text class="s" x="780" y="391">129 projects, no index</text>
  <text class="s" x="780" y="407">confidential never embedded</text>

  <path class="flow" d="M160,420 L160,428" marker-end="url(#ar)"/>

  <!-- ══ enforce() ══ -->
  <rect x="50" y="434" width="220" height="88" rx="7"
        fill="#FF5CB0" fill-opacity="0.14" stroke="#FF5CB0" stroke-opacity="0.85" stroke-width="1.4"/>
  <text class="t" x="160" y="459">enforce()</text>
  <text class="s" x="160" y="479">drop unreadable fields</text>
  <text class="s" x="160" y="495">reject hidden filter or sort</text>
  <text class="s" x="160" y="511">append row obligations</text>

  <path class="flow" d="M160,522 L160,546" marker-end="url(#ar)"/>

  <!-- ══ Compile ══ -->
  <rect class="n" x="50" y="552" width="220" height="60" rx="7"/>
  <text class="t" x="160" y="577">Compile</text>
  <text class="s" x="160" y="597">SQL or Search filters</text>

  <!-- ══ Merge ══ -->
  <path class="flow" d="M160,612 L160,634 L470,634"/>
  <path class="flow" d="M780,420 L780,634 L470,634"/>
  <path class="flow" d="M470,420 L470,644" marker-end="url(#ar)"/>

  <!-- ══ Post-retrieval filtering ══ -->
  <rect x="330" y="650" width="280" height="88" rx="7"
        fill="#4ADEE6" fill-opacity="0.13" stroke="#4ADEE6" stroke-opacity="0.8" stroke-width="1.4"/>
  <text class="t" x="470" y="675">Post-retrieval filtering</text>
  <text class="s" x="470" y="695">restricted records removed</text>
  <text class="s" x="470" y="711">ABAC grants: self, manager</text>
  <text class="s" x="470" y="727">department filter</text>

  <path class="flow" d="M470,738 L470,746" marker-end="url(#ar)"/>

  <!-- ══ Answer ══ -->
  <rect class="n" x="330" y="752" width="280" height="72" rx="7"/>
  <text class="t" x="470" y="776">Answer</text>
  <text class="s" x="470" y="795">templates + verbatim excerpts</text>
  <text class="s" x="470" y="811">says so when a budget cut it short</text>
</svg>
